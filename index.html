<!DOCTYPE html>
<html lang="en">

</head>
<body>
    <header>
    </header>
    <main>
        <section id="stripe-payment">
            <h2>Stripe</h2>
            <div id="stripe-payment-form">
                <div id="card-element"></div>
                <button>Pay with Card</button>
            </div>
        </section>
        <section id="paypal-payment">
            <h2>PayPal</h2>
            <div id="paypal-button-container">

        <section id="crypto-payment">
            <h2>Cryptocurrency</h2>
            <div>
                <p>Pay with your preferred cryptocurrency.</p>
                <button>Pay with Crypto</button>
            </div>
        </section>
        <section id="cash-app-payment">
            <h2>Cash App</h2>
            <div>
                <p>Pay with Cash App.</p>
                <button>Pay with Cash App</button>
            </div>
        </section>

    <footer>
    </footer>
    <script src="payments.js" defer></script>
